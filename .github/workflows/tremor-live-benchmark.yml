name: Tremor live benchmark (manual review only)
on:
  workflow_dispatch:
    inputs:
      case:
        description: Allowlisted unauthenticated live case
        required: true
        default: example-live
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm build
      - run: node benchmarks/run-live.mjs --case "${{ inputs.case }}" --out live-benchmark
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tremor-live-benchmark
          path: live-benchmark/live-manifest.json
          if-no-files-found: error
          retention-days: 7
