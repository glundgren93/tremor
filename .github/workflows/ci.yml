name: Distribution checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: browser-actions/setup-chrome@v1
      - run: pnpm install --frozen-lockfile
      - name: Validate source and release metadata
        run: |
          pnpm release:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm schema:check
      - name: Package from the checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir package-artifact
          npm pack --json --pack-destination package-artifact > npm-pack.json
          packed=$(node -e "const x=require('./npm-pack.json'); if(x.length!==1) process.exit(1); process.stdout.write(x[0].filename)")
          mv "package-artifact/$packed" package-artifact/tremor.tgz
      - name: Execute only the packaged CLI in a clean prefix
        run: pnpm release:smoke --tarball package-artifact/tremor.tgz
