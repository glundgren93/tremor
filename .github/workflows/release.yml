name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate clean tagged commit and coordinated versions
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          pnpm_tag=$(node -p "require('./release.json').tag")
          version=$(node -p "require('./release.json').version")
          test "$pnpm_tag" = "$GITHUB_REF_NAME"
          test "$version" = "${GITHUB_REF_NAME#v}"
          echo "tag=$pnpm_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - uses: browser-actions/setup-chrome@19ae4b339ee18925ab85cf12c1041150ea4a44c8 # v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chrome
      - name: Validate source and browser behavior
        run: |
          pnpm release:check "$GITHUB_REF_NAME"
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm schema:check
          pnpm test:e2e
      - name: Assert validation did not modify tracked source
        run: git diff --exit-code
      - name: Build canonical package and checksum
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          npm pack --pack-destination "$assets" >/dev/null
          set -- "$assets"/*.tgz
          test "$#" = 1
          test -f "$1"
          mv "$1" "$assets/tremor.tgz"
          tar -tzf "$assets/tremor.tgz" >/dev/null
          (cd "$assets" && sha256sum tremor.tgz > tremor.tgz.sha256)
          test "$(tar -xOf "$assets/tremor.tgz" package/package.json | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>process.stdout.write(JSON.parse(s).version))")" = "${GITHUB_REF_NAME#v}"
      - name: Download and verify previous canonical release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag=$(node -p "require('./release.json').upgradeFromTag")
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download "$previous_tag" --pattern tremor.tgz --pattern tremor.tgz.sha256 --dir "$RUNNER_TEMP/previous"
          (cd "$RUNNER_TEMP/previous" && sha256sum -c tremor.tgz.sha256)
      - name: Test clean install, packaged browser execution, and upgrade
        run: pnpm release:smoke --tarball "$RUNNER_TEMP/release-assets/tremor.tgz" --previous "$RUNNER_TEMP/previous/tremor.tgz"
      - name: Upload validated release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tremor-release-${{ steps.release.outputs.version }}
          path: |
            ${{ runner.temp }}/release-assets/tremor.tgz
            ${{ runner.temp }}/release-assets/tremor.tgz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: false
      - name: Require an npm CLI that supports trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          version=$(npm --version)
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error(`npm ${process.argv[1]} does not support trusted publishing`)' "$version"
      - name: Recheck that the tag still names the validated commit
        env:
          TAG: ${{ needs.build-and-validate.outputs.tag }}
          VALIDATED_COMMIT: ${{ needs.build-and-validate.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force
          test "$(git rev-list -n 1 "$TAG")" = "$VALIDATED_COMMIT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tremor-release-${{ needs.build-and-validate.outputs.version }}
          path: release-assets
      - name: Verify downloaded assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -type f | wc -l | tr -d ' ')" = 2
          (cd release-assets && sha256sum -c tremor.tgz.sha256)
          tar -tzf release-assets/tremor.tgz >/dev/null
      - name: Create or resume draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build-and-validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq .isDraft > release-state 2>/dev/null; then
            test "$(cat release-state)" = true
          else
            gh release create "$TAG" --verify-tag --draft --generate-notes --title "Tremor CLI $TAG"
          fi
      - name: Upload and independently verify draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build-and-validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-assets/tremor.tgz release-assets/tremor.tgz.sha256 --clobber
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          rm -rf verified-assets && mkdir verified-assets
          gh release download "$TAG" --pattern tremor.tgz --pattern tremor.tgz.sha256 --dir verified-assets
          test "$(find verified-assets -type f | wc -l | tr -d ' ')" = 2
          (cd verified-assets && sha256sum -c tremor.tgz.sha256)
      - name: Publish the exact validated package to npm
        env:
          PACKAGE_NAME: "@glundgren93/tremor"
          VERSION: ${{ needs.build-and-validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          local_integrity="sha512-$(openssl dgst -sha512 -binary release-assets/tremor.tgz | openssl base64 -A)"
          published=$(npm view "$PACKAGE_NAME@$VERSION" version 2>/dev/null || true)
          if [ "$published" = "$VERSION" ]; then
            echo "$PACKAGE_NAME@$VERSION already exists; verifying it before continuing."
          elif [ -n "$published" ]; then
            echo "Registry returned unexpected version: $published" >&2
            exit 1
          else
            npm publish release-assets/tremor.tgz --access public
          fi
          registry_integrity=$(npm view "$PACKAGE_NAME@$VERSION" dist.integrity)
          test "$registry_integrity" = "$local_integrity"
          provenance=$(npm view "$PACKAGE_NAME@$VERSION" dist.attestations.provenance.predicateType)
          test "$provenance" = "https://slsa.dev/provenance/v1"
      - name: Publish only the verified complete release from the unchanged tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build-and-validate.outputs.tag }}
          VALIDATED_COMMIT: ${{ needs.build-and-validate.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force
          test "$(git rev-list -n 1 "$TAG")" = "$VALIDATED_COMMIT"
          gh release edit "$TAG" --draft=false --latest
